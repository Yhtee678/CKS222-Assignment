
name: TravelGo CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show compiler version
        run: g++ --version

      - name: Create build directory
        run: mkdir -p build

      - name: Compile TravelGo
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
          -Iinclude src/main.cpp -o build/travelgo

      - name: Compile menu validation tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
          -Iinclude tests/test_menu.cpp -o build/test_menu

      - name: Run menu validation tests
        run: ./build/test_menu

      - name: Compile traveler validation tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
          -Iinclude tests/test_traveler.cpp -o build/test_traveler

      - name: Run traveler validation tests
        run: ./build/test_traveler

      - name: Compile rating validation tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
          -Iinclude tests/test_rating.cpp -o build/test_rating

      - name: Run rating validation tests
        run: ./build/test_rating

      - name: Run persistence smoke test
        run: |
          python3 tests/test_persistence.py ./build/travelgo

      - name: Run traveler capacity tests
        run: |
          python3 tests/test_traveler_capacity.py ./build/travelgo

      - name: Run hotel capacity tests
        run: |
          python3 tests/test_hotel_capacity.py ./build/travelgo
